; ==============================================================================
; RedisExt Configuration File
; Arma 2 / DayZ Origins Mod Extension
; ==============================================================================

[Redis]
; IP address of the Redis server
IP=127.0.0.1

; Redis server port (standard: 6379)
Port=6379

; Redis AUTH password (leave empty if no password is required)
Password=

; Redis database index (0-15)
DB=0

[General]
; Logging verbosity level:
; 0 = Disabled
; 1 = Informational (queries, responses, warnings, errors)
; 2 = Full debug (detailed trace logs)
LogLevel=1

[Broadcast]
; Background server heartbeat & health broadcast via HTTP API
; 1 = Enabled, 0 = Disabled
ServerDevelopBroadCast=0

; Broadcast reporting interval in minutes (1 - 60, default: 3)
IntervalMinutes=3

; Health check / telemetry API endpoint URL
ApiUrl=https://originsmod.1sl.su/api_server_broadcast

; Arma 2 game server port to report
GamePort=2302

; Custom build / server identifier tag
BuildTag=Origins183

; HTTP request timeout in seconds (2 - 60, default: 10)
TimeoutSeconds=10
